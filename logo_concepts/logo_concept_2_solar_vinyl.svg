<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Solar Aura Ring Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF5C4D"/>
      <stop offset="100%" stop-color="#FFB77F"/>
    </linearGradient>

    <!-- Vinyl Groove Pattern -->
    <radialGradient id="vinylShine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad2)" stroke="#262626" stroke-width="2"/>

  <!-- Outer Solar Aura Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#solarGrad)" stroke-width="12" filter="url(#glow2)"/>

  <!-- Vinyl Disc Base -->
  <circle cx="256" cy="256" r="144" fill="url(#vinylShine)"/>

  <!-- Concentric Groove Lines -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Center Label Disc -->
  <circle cx="256" cy="256" r="54" fill="url(#solarGrad)"/>

  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="16" fill="#0A0A0A"/>

  <!-- Center Accent Dot -->
  <circle cx="256" cy="256" r="6" fill="#FFF"/>
</svg>
