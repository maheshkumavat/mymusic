<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept 2: The Rhythmic Flow -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="#000000"/>
  
  <!-- Subtle Glow -->
  <rect x="100" y="100" width="312" height="312" rx="60" fill="url(#grad2)" fill-opacity="0.1" filter="url(#blur2)"/>

  <!-- Vector Icon: Intersecting Sine Waves -->
  <path d="M128 320C128 320 160 192 256 192C352 192 384 320 384 320" stroke="url(#grad2)" stroke-width="28" stroke-linecap="round"/>
  <path d="M128 192C128 192 160 320 256 320C352 320 384 192 384 192" stroke="url(#grad2)" stroke-width="28" stroke-linecap="round" stroke-opacity="0.6"/>

  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
</svg>
