<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1813"/>
      <stop offset="100%" stop-color="#080705"/>
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5C4D"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>

    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad5)" stroke="#332B1E" stroke-width="2"/>

  <!-- Frequency Equalizer Bars forming a Music Note Stem & Head -->
  <g filter="url(#glow5)">
    <!-- Note Head Disc -->
    <ellipse cx="180" cy="320" rx="48" ry="36" fill="url(#neonGrad)" transform="rotate(-20 180 320)"/>

    <!-- Stem Equalizer Columns -->
    <rect x="204" y="160" width="18" height="150" rx="9" fill="url(#neonGrad)"/>
    <rect x="230" y="130" width="18" height="180" rx="9" fill="url(#neonGrad)"/>
    <rect x="256" y="150" width="18" height="160" rx="9" fill="url(#neonGrad)"/>

    <!-- Top Beam Wave Accent -->
    <path d="M 204 150 Q 256 110 330 160" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
