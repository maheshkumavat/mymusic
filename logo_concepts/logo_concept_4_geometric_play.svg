<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A1E"/>
      <stop offset="100%" stop-color="#05080A"/>
    </linearGradient>

    <linearGradient id="accentGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5C4D"/>
    </linearGradient>

    <linearGradient id="secondaryGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad4)" stroke="#1E293B" stroke-width="2"/>

  <!-- Geometric 'M' Pillars -->
  <!-- Left Pillar -->
  <rect x="140" y="160" width="44" height="192" rx="22" fill="url(#secondaryGrad4)"/>

  <!-- Right Pillar -->
  <rect x="328" y="160" width="44" height="192" rx="22" fill="url(#secondaryGrad4)"/>

  <!-- Diagonal Chevron / Play Chevron center -->
  <g filter="url(#glow4)">
    <path d="M 184 180 
             L 256 256 
             L 184 332" 
          fill="none" 
          stroke="url(#accentGrad4)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 328 180 
             L 256 256 
             L 328 332" 
          fill="none" 
          stroke="url(#accentGrad4)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.3"/>
  </g>
</svg>
