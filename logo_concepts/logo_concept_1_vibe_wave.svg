<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    
    <!-- Accent Soundwave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF5C4D"/>
      <stop offset="100%" stop-color="#FFB77F"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas (30px / 120px radius ratio) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad1)" stroke="#333" stroke-width="2"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#FF8A00" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Center 'M' Wave Path -->
  <g filter="url(#glow1)">
    <path d="M 128 320 
             C 140 320, 150 200, 168 180
             C 186 160, 204 310, 224 310
             C 244 310, 268 160, 288 180
             C 308 200, 320 320, 336 320
             C 352 320, 364 240, 384 240"
          fill="none" 
          stroke="url(#waveGrad1)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Accent Equalizer Dots -->
  <circle cx="168" cy="180" r="10" fill="#FFF" opacity="0.9"/>
  <circle cx="288" cy="180" r="10" fill="#FFF" opacity="0.9"/>
  <circle cx="224" cy="310" r="8" fill="#FF8A00"/>
</svg>
