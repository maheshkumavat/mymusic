apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.personal.mymusic'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.mymusic"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "1.0.20"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (!keystorePropertiesFile.exists()) {
        keystorePropertiesFile = rootProject.file("local.properties")
    }
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    def getSignProp = { String propName, List<String> envNames ->
        def value = keystoreProperties.getProperty(propName)
        if (value != null && !value.trim().isEmpty()) {
            return value.trim()
        }
        for (String envName : envNames) {
            def envVal = System.getenv(envName)
            if (envVal != null && !envVal.trim().isEmpty()) {
                return envVal.trim()
            }
        }
        return null
    }

    def resolveKeystoreFile = { String path ->
        if (!path) return null
        def f = new File(path)
        if (f.isAbsolute() && f.exists()) return f
        def fromRoot = new File(rootProject.projectDir, path)
        if (fromRoot.exists()) return fromRoot
        def fromApp = new File(projectDir, path)
        if (fromApp.exists()) return fromApp
        return fromRoot
    }

    def storeFilePath = getSignProp("storeFile", ["KEYSTORE_FILE", "STORE_FILE", "KEYSTORE_PATH"])
    def storePwd = getSignProp("storePassword", ["KEYSTORE_PASSWORD", "STORE_PASSWORD"])
    def keyAl = getSignProp("keyAlias", ["KEY_ALIAS", "KEYSTORE_ALIAS"])
    def keyPwd = getSignProp("keyPassword", ["KEY_PASSWORD"])

    def resolvedKeystoreFile = resolveKeystoreFile(storeFilePath)

    signingConfigs {
        release {
            if (resolvedKeystoreFile != null && storePwd && keyAl && keyPwd) {
                storeFile resolvedKeystoreFile
                storePassword storePwd
                keyAlias keyAl
                keyPassword keyPwd
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def isRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
        if (isRelease) {
            if (!storeFilePath || !storePwd || !keyAl || !keyPwd) {
                throw new GradleException("Release build failed: Missing release signing credentials! Please provide a git-ignored keystore.properties file (with storeFile, storePassword, keyAlias, keyPassword) or set environment variables (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).")
            }
            if (resolvedKeystoreFile == null || !resolvedKeystoreFile.exists()) {
                throw new GradleException("Release build failed: Keystore file not found at '${storeFilePath}'. Resolved to: '${resolvedKeystoreFile?.absolutePath}'. Ensure the release keystore exists outside the repository tree as configured.")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-opt-in=androidx.media3.common.util.UnstableApi"]
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    // Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // NewPipeExtractor
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    
    // OkHttp (for downloader)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Coil (Image loading)
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}





























































